<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prologue Task</title>
    <style>
        /* Inline CSS Styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2.5rem;
            margin: 10px 0;
        }

        header p {
            font-size: 1.2rem;
            margin: 0;
        }

        section.task {
            flex: 1;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        section.task h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ff9900;
        }

        section.task p {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .puzzle-image {
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            display: block;
            border-radius: 8px;
            border: 2px solid white;
        }

        .response {
            margin-top: 20px;
            text-align: center;
        }

        .response input {
            padding: 10px;
            width: calc(100% - 24px);
            max-width: 300px;
            font-size: 1rem;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        .response button {
            padding: 10px 20px;
            background-color: #ff9900;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .response button:hover {
            background-color: #cc7a00;
        }

        #feedback {
            margin-top: 20px;
            font-size: 1rem;
        }

        .next-button {
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #00cc66;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            display: none; /* Initially hidden */
            align-self: center; /* Centers the button within the section */
        }

        .next-button:hover {
            background-color: #00994d;
        }

        footer {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            margin-top: auto;
        }

        footer p {
            font-size: 0.9rem;
            margin: 0;
        }

        footer a {
            color: #ff9900;
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #cc7a00;
        }
    </style>
</head>
<body>
    <header>
        <h1>Prologue: Unlock the Activation Key</h1>
        <p>Welcome, Chrono-Tracker! Your journey begins now.</p>
    </header>
    <section class="task">
        <h2>Your Mission</h2>
        <p>Decode the activation key using the visual puzzle below. The QR code holds the clue to your next challenge.</p>
        <img src="images/visual_puzzle.png" alt="Visual Puzzle" class="puzzle-image">
        <div class="response">
            <input type="text" id="taskInput" placeholder="Enter your answer here">
            <button id="submitTask">Submit</button>
        </div>
        <p id="feedback"></p>
        <!-- Next Button -->
        <button class="next-button" id="nextButton" onclick="goToNextTask()">Next Task</button>
    </section>
    <footer>
        <p>© 3024 Chrono-Tech Events | <a href="#contact">Contact Us</a></p>
    </footer>
    <script>
        // Basic JavaScript for task feedback
        document.getElementById('submitTask').addEventListener('click', () => {
            const input = document.getElementById('taskInput').value.trim();
            const feedback = document.getElementById('feedback');
            const nextButton = document.getElementById('nextButton');

            if (input === "activationkey123") { // Replace with actual key
                feedback.textContent = " Success! The sands of time have shifted in your favor—onward to the next challenge!";
                feedback.style.color = "lightgreen";
                nextButton.style.display = "block"; // Show the Next button
            } else {
                feedback.textContent = "❌ Incorrect key. Try again!";
                feedback.style.color = "lightcoral";
            }
        });

        // Function to navigate to the next task
        function goToNextTask() {
            window.location.href = "/task2.html"; // Replace with the URL of Task 2
        }
    </script>
</body>
</html>
